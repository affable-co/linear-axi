name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (Node ${{ matrix.node-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node-version: [22, 24]
    steps:
      - name: Check out
        uses: actions/checkout@v6

      # pnpm version comes from package.json "packageManager".
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated skill
        run: pnpm run build:skill -- --check

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm run build

      - name: Verify executable is built
        run: node --input-type=module -e 'import { access } from "node:fs/promises"; await access("dist/bin/linear-axi.js")'
